openapi: 3.1.0
info:
  title: AI Copilot Module API
  version: 1.0.0
  description: >
    IPC API for the AI Copilot and the AI bill scan. Channels are registered in
    server/ipc/registerIntegrationHandlers.js and exposed to the renderer via preload.js as
    window.api.ai.<method>.

    The model is configured by the operator through environment variables (AI_API_KEY,
    AI_BASE_URL, AI_MODEL, with GEMINI_API_KEY as a fallback); nothing is entered in the UI and
    the renderer only ever receives a masked status. ai:ask drives any OpenAI-compatible
    /chat/completions endpoint (Groq by default) with three consolidated tools (query, lookup,
    propose) over the existing accounting services. The loop is capped at 6 rounds, each model
    request times out after 60 s, and on the last round the model is asked to answer from what
    it has gathered. What is sent to the provider includes the prompt, the chat history and the
    tool results (for example ledger names, party names and amounts).

    The agent never writes. propose returns a proposal the user must approve in the app; the
    renderer then calls the proposal's channel with its args. Voucher drafts are rebuilt and
    checked on the server (active company only, a financial year of that company, a date inside
    it, the company's own ledgers, Dr = Cr for every type, no Payroll) and are approved through
    automation:createVoucher, which validates the payload again.

    The query tool's resource enum includes audit_trail, which routes to
    auditTrailService.getAll(company_id, { limit }) read-only (limit defaults to 50).
tags:
  - name: ai
    description: AI Copilot and AI bill scan.
paths:
  /ai/getKeyStatus:
    post:
      operationId: ai.getKeyStatus
      tags: [ai]
      summary: Whether a Copilot model is configured on the server, its endpoint, model and masked key.
      x-ipc-channel: 'ai:getKeyStatus'
      x-window-api: 'window.api.ai.getKeyStatus'
      x-controller: 'aiController.getKeyStatus'
      responses:
        '200':
          description: Non-secret status. The raw key never leaves the main process.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyStatus' }
  /ai/ask:
    post:
      operationId: ai.ask
      tags: [ai]
      summary: Ask the Copilot. Runs the capped tool loop and returns the answer, any proposals to approve, and a trace of the tool calls.
      x-ipc-channel: 'ai:ask'
      x-window-api: 'window.api.ai.ask'
      x-controller: 'aiController.ask'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
                context:
                  type: object
                  description: The active company and financial year; tools read them from here.
                  properties:
                    company_id: { type: number }
                    fy_id: { type: number }
                history:
                  type: array
                  items:
                    type: object
                    properties:
                      role: { type: string, enum: [user, assistant] }
                      text: { type: string }
              required: [prompt]
      responses:
        '200':
          description: The Copilot's answer, or success false with an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AskResult' }
  /ai/scanBillStatus:
    post:
      operationId: ai.scanBillStatus
      tags: [ai]
      summary: Whether the bill scan (Gemini, GEMINI_API_KEY) is configured, its model and masked key.
      x-ipc-channel: 'ai:scanBillStatus'
      x-window-api: 'window.api.ai.scanBillStatus'
      x-controller: 'billScanController.getStatus'
      responses:
        '200':
          description: Non-secret status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanBillStatus' }
  /ai/scanBill:
    post:
      operationId: ai.scanBill
      tags: [ai]
      summary: Read a bill image with Gemini and return a draft voucher with names matched to this company's masters. Nothing is saved.
      description: >
        The image is sent to Google Gemini. The draft is opened in the voucher entry screen for
        review; saving goes through the normal voucher create path.
      x-ipc-channel: 'ai:scanBill'
      x-window-api: 'window.api.ai.scanBill'
      x-controller: 'billScanController.scanBill'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                company_id: { type: number }
                fy_id: { type: number }
                imageBase64: { type: string }
                mimeType: { type: string }
              required: [company_id, imageBase64]
      responses:
        '200':
          description: The draft, or success false with an error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanBillResult' }
components:
  schemas:
    KeyStatus:
      type: object
      properties:
        hasKey: { type: boolean }
        baseUrl: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        masked: { type: [string, 'null'] }
    PreviewRow:
      type: object
      description: One row of a proposal preview, built on the server.
      properties:
        label: { type: string }
        value: { type: string }
        detail: { type: string }
      required: [label, value]
    Proposal:
      type: object
      description: A write the user must approve. On approval the renderer calls `channel` with `args`.
      properties:
        action: { type: string, enum: [create_voucher, reconcile, unreconcile] }
        channel:
          type: string
          description: automation:createVoucher for create_voucher; banking:reconcile or banking:unreconcile.
        args: { type: object, additionalProperties: true }
        summary:
          type: string
          description: Built on the server when the action has a preview, else the model's summary.
        note: { type: string, description: "The model's own summary, when the server built one." }
        preview:
          type: array
          items: { $ref: '#/components/schemas/PreviewRow' }
        requiresApproval: { type: boolean }
    ToolTraceEntry:
      type: object
      description: One tool call made while answering.
      properties:
        tool: { type: string, enum: [query, lookup, propose] }
        input: { type: object, additionalProperties: true }
        ok: { type: boolean }
        error: { type: string }
        ms: { type: number }
    AskResult:
      type: object
      properties:
        success: { type: boolean }
        model: { type: string }
        text: { type: string }
        error: { type: string }
        rounds: { type: number }
        capped:
          type: boolean
          description: Set when the round limit was reached and the model still asked for tools.
        proposals:
          type: array
          items: { $ref: '#/components/schemas/Proposal' }
        toolTrace:
          type: array
          items: { $ref: '#/components/schemas/ToolTraceEntry' }
    ScanBillStatus:
      type: object
      properties:
        hasKey: { type: boolean }
        model: { type: [string, 'null'] }
        masked: { type: [string, 'null'] }
    ScanBillResult:
      type: object
      properties:
        success: { type: boolean }
        error: { type: string }
        model: { type: string }
        draft:
          type: object
          additionalProperties: true
          description: Voucher draft in the shape the entry screen hydrates (not saved).
        unresolvedLedgers: { type: array, items: { type: string } }
        unresolvedItems: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
